# Fetched by chezmoi itself, so they land in the same place on every OS
# instead of wherever brew / apt / pacman / xbps put them.
# Refreshed weekly on `chezmoi apply`, or now with `chezmoi apply --refresh-externals`.
# Always rendered as a template. zsh plugins: not on client machines, which use bash.
{{ if not .client }}
[".local/share/zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/heads/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".local/share/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/heads/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"
{{ end }}
