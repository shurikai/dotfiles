# Managed by chezmoi.
#
# Bindings mirror the WezTerm leader table on purpose: same prefix (Ctrl-b),
# same keys. So muscle memory is identical whether you're in WezTerm on the
# Mac or in tmux on the Coder workspace through the VDI.
#
# Inside WezTerm, WezTerm's leader takes the first Ctrl-b. Press Ctrl-b twice
# to send one through to a remote tmux, then the key.
#
#   prefix s / v      split below / right       prefix t      new window
#   prefix h j k l    move between panes        prefix [ ]    prev / next window
#   prefix z          zoom pane                 prefix n      pick a window
#   prefix q          close pane (confirms)     prefix w      pick a session
#   prefix r          resize mode (hjkl, any other key exits)
#   prefix Space      command prompt            prefix Escape copy mode (vi keys)
#   prefix R          reload this file

# ---- Basics --------------------------------------------------------------------
set -g prefix C-b
bind C-b send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # Neovim feels laggy on Esc without this
set -g focus-events on          # Neovim autoread / gitsigns refresh
setw -g mode-keys vi

# True color + undercurl through WezTerm and most VDI terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"

# Copy via OSC 52, so yanks reach the local clipboard through SSH (and,
# if the VDI terminal passes it on, through the VDI too).
set -g set-clipboard on

# ---- Panes (WezTerm: s / v / hjkl / z / q / r) ---------------------------------
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind q confirm-before -p "kill pane? (y/n)" kill-pane

# Resize mode: each key re-enters the table, so hjkl repeat until any other key.
bind r switch-client -T resize
bind -T resize h resize-pane -L 2 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 2 \; switch-client -T resize

# ---- Windows = WezTerm tabs (t / [ / ] / n) ------------------------------------
bind t new-window -c "#{pane_current_path}"
bind [ previous-window
bind ] next-window
bind n choose-tree -Zw

# ---- Sessions = WezTerm workspaces (w) -----------------------------------------
bind w choose-tree -Zs

# ---- Everything else -------------------------------------------------------------
bind Space command-prompt
bind Escape copy-mode           # [ is taken by windows, as in WezTerm
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- Status line: same layout and colors as the WezTerm status bar -------------
# (Kanagawa, pending the theme scrub.)
set -g status-position bottom
set -g status-style "bg=#16161D,fg=#DCD7BA"
set -g status-left-length 40
set -g status-left "#[fg=#B98D7B]  #{?client_prefix,PREFIX,#{?#{==:#{client_key_table},resize},RESIZE,#S}}  "
set -g status-right "#[fg=#D27E99]#{pane_current_command} #[fg=#727169]| #[fg=#7E9CD8]%-I:%M%P "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#938AA9,fg=#DCD7BA] #I #W "
set -g pane-border-style "fg=#54546D"
set -g pane-active-border-style "fg=#938AA9"
